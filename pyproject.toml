[project]
name = "odslint"
version = "0.2.0"
description = "A linter for LibreOffice Calc spreadsheets (.ods and flat .fods)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]
authors = [{ name = "Florian Wilhelm", email = "fwilhelm.wgt+github@gmail.com" }]
keywords = ["ods", "fods", "opendocument", "libreoffice", "spreadsheet", "linter"]
license = "MIT"
# LICENSES/ carries the MPL-2.0 text for src/odslint/vendor/flat_odf_cleanup.py,
# which ships in the wheel and may not travel without its license.
license-files = ["LICENSE", "LICENSES/*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/fwilhe2/odslint"
Repository = "https://github.com/fwilhe2/odslint"
Issues = "https://github.com/fwilhe2/odslint/issues"

[project.scripts]
odslint = "odslint.cli:main"
odslint-clean = "odslint.cleanup:main"

# PEP 639 (license / license-files as written above) needs hatchling 1.27+.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odslint"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# A fork of an upstream script, kept in upstream's style so that a diff against
# LibreOffice's version stays readable.
extend-exclude = ["src/odslint/vendor/flat_odf_cleanup.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["odslint", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/odslint"]

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

# Same reason as the ruff exclusion: untyped upstream code, kept in its own style.
# odslint.cleanup is the typed boundary in front of it.
[[tool.mypy.overrides]]
module = "odslint.vendor.flat_odf_cleanup"
ignore_errors = true
