[project]
name = "odslint"
version = "0.1.0"
description = "A linter for LibreOffice Calc spreadsheets (.ods and flat .fods)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[project.scripts]
odslint = "odslint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odslint"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["odslint", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/odslint"]

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true
