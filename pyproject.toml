[project]
name = "odslint"
version = "0.1.0"
description = "A linter for LibreOffice Calc spreadsheets (.ods and flat .fods)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[project.scripts]
odslint = "odslint.cli:main"
odslint-clean = "odslint.cleanup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odslint"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored verbatim from upstream so it can be resynced with a plain curl.
extend-exclude = ["src/odslint/vendor/flat_odf_cleanup.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["odslint", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/odslint"]

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

# Same reason as the ruff exclusion: untyped upstream code, kept verbatim.
# odslint.cleanup is the typed boundary in front of it.
[[tool.mypy.overrides]]
module = "odslint.vendor.flat_odf_cleanup"
ignore_errors = true
