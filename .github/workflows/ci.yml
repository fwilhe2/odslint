name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync

      - run: uv run pytest

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

  roundtrip:
    # tests/test_libreoffice_roundtrip.py skips itself without soffice, so this
    # is the only job that actually runs it — it is what catches hand-written
    # fixtures drifting from what Calc really writes.
    name: libreoffice round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install LibreOffice Calc
        # The python script provider and python3-uno are only *recommends* of
        # libreoffice-calc, but without them Calc aborts the conversion batch on
        # the first fixture carrying an office:annotation.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreoffice-calc libreoffice-script-provider-python python3-uno

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync

      - name: TEMPORARY probe - bisect suppression.fods
        run: |
          soffice --version
          mkdir -p /tmp/variants
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("tests/fixtures/suppression.fods").read_text()
          out = pathlib.Path("/tmp/variants")

          b1 = re.search(r"\n\s*<office:annotation>\n.*?</office:annotation>", src, re.S).group(0)
          a2 = "<office:annotation><text:p>odslint-disable</text:p></office:annotation>\n            "

          variants = {
              "baseline": src,
              "no-b1-annotation": src.replace(b1, ""),
              "no-a2-annotation": src.replace(a2, ""),
              "no-annotations": src.replace(b1, "").replace(a2, ""),
              "no-string-value": src.replace(' office:string-value="2024-01-31"', ""),
              "with-dc-svg-ns": src.replace(
                  'xmlns:calcext=',
                  'xmlns:dc="http://purl.org/dc/elements/1.1/"\n'
                  '    xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0"\n'
                  '    xmlns:calcext=',
              ),
          }
          for name, text in variants.items():
              (out / f"{name}.fods").write_text(text)
              print(f"wrote {name}.fods ({len(text)} bytes, changed={text != src})")
          PY
          set +e
          for f in /tmp/variants/*.fods; do
            rm -rf /tmp/vout; mkdir -p /tmp/vout
            timeout 120 soffice --headless --convert-to ods --outdir /tmp/vout "$f" >/tmp/log 2>&1
            echo "=== $(basename $f) produced=[$(ls /tmp/vout)] $(grep -c 'Unspecified Application Error' /tmp/log) errors"
          done

      - name: Fail if LibreOffice was not picked up
        run: uv run python -c "import shutil,sys; sys.exit(0 if shutil.which('soffice') else 'soffice not on PATH')"

      - run: uv run pytest tests/test_libreoffice_roundtrip.py -v
