name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync

      - run: uv run pytest

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

  roundtrip:
    # tests/test_libreoffice_roundtrip.py skips itself without soffice, so this
    # is the only job that actually runs it — it is what catches hand-written
    # fixtures drifting from what Calc really writes.
    name: libreoffice round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install LibreOffice Calc
        # The python script provider and python3-uno are only *recommends* of
        # libreoffice-calc, but without them Calc aborts the conversion batch on
        # the first fixture carrying an office:annotation.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreoffice-calc libreoffice-script-provider-python python3-uno

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync

      - name: Fail if LibreOffice was not picked up
        run: uv run python -c "import shutil,sys; sys.exit(0 if shutil.which('soffice') else 'soffice not on PATH')"

      - run: uv run pytest tests/test_libreoffice_roundtrip.py -v
