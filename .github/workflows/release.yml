name: Release

# Publishes to PyPI via trusted publishing (OIDC) — no API token in secrets.
# The PyPI publisher must be registered as: owner fwilhe2, repo odslint,
# workflow release.yml, environment pypi.
#
# To cut a release: bump `version` in pyproject.toml, commit, then
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .oxt to the GitHub release
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv version --short)
          tag=${GITHUB_REF#refs/tags/v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match pyproject version $version"
            exit 1
          fi
          echo "version $version matches tag"

      - run: uv build

      - name: Check the wheel carries both licenses
        # The forked flat_odf_cleanup.py is MPL-2.0 and may not ship without
        # its license text; a wheel missing it is not distributable.
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          missing = [
              n for n in ("dist-info/licenses/LICENSE", "dist-info/licenses/LICENSES/MPL-2.0.txt")
              if not any(name.endswith(n) for name in names)
          ]
          sys.exit(f"{wheel.name} is missing {missing}" if missing else 0)
          PY

      - name: Build the LibreOffice extension
        # The .oxt is a GitHub release asset, not a PyPI artifact: it is
        # installed through LibreOffice's extension manager, and it needs the
        # published odslint on PATH to do anything.
        run: python3 tools/build_oxt.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: oxt
          path: dist-oxt/
          if-no-files-found: error


      - name: Create Release
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" --title "Release ${GITHUB_REF#refs/tags/}" --notes "Release ${GITHUB_REF#refs/tags/}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the extension to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist-oxt/*.oxt --clobber

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Gate the release behind an environment so it can carry required reviewers.
    environment:
      name: pypi
      url: https://pypi.org/p/odslint
    permissions:
      id-token: write # mint the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # This job never checks out the repo — it only publishes the artifact
          # the build job produced — so there is no manifest to key a cache on.
          enable-cache: false

      - run: uv publish --trusted-publishing always
